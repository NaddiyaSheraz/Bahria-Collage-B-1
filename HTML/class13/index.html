<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <h1 title="BCKC">Bahria Collage Karim Campus</h1>
    <form>
      <fieldset>
        <legend>Personal Info</legend>
        <h2>Employee Name</h2>
        <input type="text" id="FName" placeholder="Enter your Name"/> &nbsp;&nbsp;&nbsp;
        <input type="text" id="LName" /> <br />
        <label for="FName">First Name</label>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="LName">Last Name</label>

        <h2>Employee Id Number</h2>
        <input type="number" style="width: 90%" />
      </fieldset>

      <fieldset>
        <legend>Department Info</legend>
        <h2>Department Name</h2>
        <input type="number" style="width: 90%" />

        <h2>TextArea</h2>
        <textarea cols="50" rows="5"></textarea>

        <h2>Radio Button</h2>
        <input type="radio" name="Gender" checked />Female
        <input type="radio" name="Gender" />Male
        <input type="radio" name="Gender" />Other

        <br /><br />
      </fieldset>

      <fieldset>
        <legend>contact info</legend>
        <label for="">Do you have Laptop</label> <br />
        <input type="radio" name="HaveLaptop" /> Yes
        <input type="radio" name="HaveLaptop" />No

        <h2>Check Box</h2>
        <input type="checkbox" name="Sub" />English
        <input type="checkbox" name="Sub" />Maths
        <input type="checkbox" name="Sub" />Science

        <h2>DropDown</h2>
        <select name="devices">
          <option value="ipod">iPod</option>
          <option value="radio">Radio</option>
          <option value="computer">Computer</option>
        </select>

        <select>
          <option value="Karachi">Karachi</option>
          <option value="lahore">Lahore</option>
          <option value="Haripure">Haripure</option>
          <option value="Islamabad">Islamabad</option>
        </select>
        <br />
      </fieldset>

      <fieldset>
        <legend>Personal Data</legend>
        <label for="Cv">CV</label>
        <input type="file" id="Cv" /> <br />
        <br />

        <label for="image">Upload Image</label>
        <input type="image" src="form.jpg" width="100px" id="image" />
      </fieldset>
    </form>
  </body>
</html>
